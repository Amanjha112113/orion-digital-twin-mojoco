<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="ORION-FACTORY Self-Healing Manufacturing Digital Twin Dashboard" />
    <title>ORION-FACTORY | Self-Healing Twin Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#0b0b0e',
              surface: 'rgba(23, 23, 29, 0.65)',
              border: 'rgba(255, 255, 255, 0.08)',
              primary: '#6c5ce7',
              accent: '#00cec9',
            },
            boxShadow: {
              'glow-primary': '0 0 25px -5px rgba(108, 92, 231, 0.4)',
              'glow-green': '0 0 25px -5px rgba(16, 185, 129, 0.4)',
              'glow-red': '0 0 25px -5px rgba(239, 68, 68, 0.4)',
              'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.4)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0b0b0e;
        color: #f3f4f6;
        overflow-x: hidden;
      }
      .glass-card {
        background: rgba(23, 23, 31, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(108, 92, 231, 0.4);
        box-shadow: 0 0 25px -5px rgba(108, 92, 231, 0.25);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0b0b0e; }
      ::-webkit-scrollbar-thumb { background: #262632; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3f3f50; }
    </style>
  </head>
  <body class="bg-[#0b0b0e] text-gray-100 selection:bg-purple-500 selection:text-white">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
